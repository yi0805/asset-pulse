@if (loading) {
  <app-loading-state message="Loading asset…" />
} @else if (error && !asset) {
  <app-error-state
    [message]="error.status === 404 ? 'This asset does not exist.' : error.detail || error.title"
    [canRetry]="true"
    (retry)="retry()"
  />
} @else if (asset && formValue) {
  <section aria-labelledby="edit-heading">
    <h1 id="edit-heading">Edit asset</h1>
    <p>
      Current derived status: <strong>{{ asset.status }}</strong
      >. Status is read-only.
    </p>
    @if (error && !error.errors) {
      <p class="save-error" role="alert">{{ error.detail || error.title }}</p>
    }
    <app-asset-form
      [initialValue]="formValue"
      [saving]="saving"
      (submitted)="save($event)"
    /><button type="button" class="cancel" (click)="cancel()">Cancel</button>
  </section>
}
